name: CI

on:
  push:
    branches:
      - main
      - "ihk/**"
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/itmart_build
        run: pnpm build

      - name: Test
        env:
          DATABASE_URL: postgresql://test:test@127.0.0.1:5432/test
        run: pnpm test